<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Explorer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='6'%20fill='%2316171B'/%3E%3Cg%20transform='translate%283.6%203.6%29%20scale%280.7%29'%3E%3Cpath%20fill='%23F2F1EE'%20d='M7%202H14.6L19.5%206.9V10.4H4.5V4.5A2.5%202.5%200%200%201%207%202Z'/%3E%3Cpath%20fill='%239C9B96'%20d='M14.6%202V5.2A1.7%201.7%200%200%200%2016.3%206.9H19.5Z'/%3E%3Crect%20fill='%23F2B544'%20x='2'%20y='12'%20width='20'%20height='3.6'%20rx='1.8'/%3E%3Cpath%20fill='%23F2F1EE'%20d='M4.5%2017.2H19.5V19.5A2.5%202.5%200%200%201%2017%2022H7A2.5%202.5%200%200%201%204.5%2019.5Z'/%3E%3C/g%3E%3C/svg%3E">
    <meta name="color-scheme" content="light dark">
    <script>
        try {
            const saved = localStorage.getItem('ba-theme');
            if (saved === 'light') document.documentElement.dataset.theme = 'light';
        } catch (_) { /* storage blocked: follow the system setting */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="style.css?v=20261011-8">
    <style>
        /* Warehouse explorer: a standalone page in the working-paper style. */
        .header {
            border-bottom: 1px solid var(--line);
            padding: 16px max(40px, calc((100vw - 1000px) / 2));
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header h1 { font-size: var(--text-xl); font-weight: 600; line-height: 1.3; }
        .header-back { font-size: var(--text-sm); color: var(--ink-3); text-decoration: none; }
        .header-back:hover { color: var(--gold); }
        .status-bar { display: flex; gap: 28px; flex-wrap: wrap; font-size: var(--text-sm); color: var(--ink-3); }
        .stat .value { color: var(--ink); font-weight: 600; margin-left: 6px; }
        .container { max-width: 1080px; margin: 0 auto; padding: 36px 40px 72px; }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); padding: 22px 24px; }
        .card + .card { margin-top: 18px; }
        .header { position: relative; z-index: 2; }
        .container { position: relative; z-index: 2; }
        .card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
        .card-header h2 { font-size: var(--text-lg); font-weight: 600; }
        .btn-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
        .sql-editor { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
        .quick-queries { display: flex; flex-wrap: wrap; gap: 4px 18px; }
        .quick-btn { border: 0; background: none; padding: 2px 0; font-size: var(--text-sm); color: var(--gold); cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
        .quick-btn:hover { text-decoration-color: currentColor; }
        .sql-input {
            width: 100%; min-height: 140px; resize: vertical;
            padding: 12px 14px;
            font-family: var(--font-mono); font-size: var(--text-sm); line-height: 1.6;
            background: var(--surface); color: var(--ink);
            border: 1px solid var(--line-strong); border-radius: var(--r-control); outline: none;
        }
        .sql-input:focus { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
        .results-wrapper { max-height: 520px; overflow: auto; margin-top: 6px; }
        .results-table .numeric { text-align: right; }
        .results-table td, .results-table th { white-space: nowrap; }
        .results-table td { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
        .result-info { font-size: var(--text-sm); color: var(--ink-3); margin-top: 6px; }
        .error-msg { color: var(--bad); font-size: var(--text-sm); padding: 8px 0; }
        .schema-block { font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1.65; color: var(--ink-2); background: var(--surface-2); padding: 14px; white-space: pre-wrap; overflow: auto; max-height: 420px; }
        @media (max-width: 768px) { .header, .container { padding-left: 16px; padding-right: 16px; } }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <a class="header-back" href="/#dashboard">Business Agent</a>
            <h1>DuckDB Warehouse Explorer</h1>
        </div>
        <div class="status-bar" id="statusBar">
            <div class="stat">Records <span class="value" id="totalRecords">-</span></div>
            <div class="stat">Documents <span class="value" id="totalDocs">-</span></div>
            <div class="stat">Years <span class="value" id="availableYears">-</span></div>
        </div>
    </div>

    <div class="container">
        <!-- SQL Editor -->
        <div class="card">
            <div class="card-header">
                <h2>SQL query</h2>
                <div class="btn-row">
                    <button class="link-btn" onclick="syncWarehouse()">Sync from PG</button>
                    <button class="link-btn is-danger" onclick="resetWarehouse()">Reset DuckDB</button>
                </div>
            </div>
            <div class="card-body sql-editor">
                <div class="quick-queries">
                    <button class="quick-btn" onclick="setQuery(`SELECT * FROM fact_financial_metrics LIMIT 50`)">All facts</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT DISTINCT row_label FROM fact_financial_metrics ORDER BY row_label`)">All labels</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT DISTINCT metric_year FROM fact_financial_metrics ORDER BY metric_year`)">Years</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT DISTINCT table_name, COUNT(*) as cnt FROM fact_financial_metrics GROUP BY table_name ORDER BY cnt DESC`)">Tables</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT row_label, metric_year, raw_value, unit FROM fact_financial_metrics WHERE row_label LIKE '%สินทรัพย์รวม%' ORDER BY metric_year`)">สินทรัพย์รวม</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT row_label, metric_year, raw_value, numeric_value, unit FROM fact_financial_metrics WHERE unit = '%' ORDER BY row_label, metric_year`)">อัตราส่วน (%)</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT * FROM dim_documents`)">Documents</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT * FROM dim_tables`)">Tables dim</button>
                    <button class="quick-btn" onclick="setQuery(`SELECT row_label, col_name, col_value FROM dim_table_rows ORDER BY row_index, col_name LIMIT 50`)">Lookup data</button>
                </div>
                <label for="sqlInput" class="visually-hidden">SQL query</label>
                <textarea class="sql-input" id="sqlInput" placeholder="SELECT * FROM fact_financial_metrics LIMIT 20">SELECT * FROM fact_financial_metrics LIMIT 20</textarea>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="runQuery()">Run query</button>
                    <button class="link-btn" onclick="document.getElementById('sqlInput').value=''">Clear</button>
                </div>
                <div id="results"></div>
            </div>
        </div>

        <!-- Schema -->
        <div class="card">
            <div class="card-header">
                <h2>Schema</h2>
                <button class="link-btn" onclick="loadSchema()">Refresh</button>
            </div>
            <div class="card-body">
                <pre class="schema-block" id="schemaBlock">Loading...</pre>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        async function loadStatus() {
            try {
                const res = await fetch(`${API}/api/warehouse/status`);
                const data = await res.json();
                document.getElementById('totalRecords').textContent = data.total_fact_records?.toLocaleString() || '0';
                document.getElementById('totalDocs').textContent = data.total_documents || '0';
                document.getElementById('availableYears').textContent = (data.available_years || []).join(', ') || '-';
            } catch (e) {
                console.error('Status load failed:', e);
            }
        }

        async function loadSchema() {
            try {
                const res = await fetch(`${API}/api/warehouse/schema`);
                const data = await res.json();
                document.getElementById('schemaBlock').textContent = data.schema || 'No schema available';
            } catch (e) {
                document.getElementById('schemaBlock').textContent = `Error: ${e.message}`;
            }
        }

        function setQuery(sql) {
            document.getElementById('sqlInput').value = sql;
            runQuery();
        }

        async function runQuery() {
            const sql = document.getElementById('sqlInput').value.trim();
            if (!sql) return;

            const container = document.getElementById('results');
            container.innerHTML = '<div style="padding:1rem;color:var(--text-dim)"><div class="progress-line"></div><span class="loading-text">Running...</span></div>';

            try {
                const res = await fetch(`${API}/api/warehouse/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql }),
                });
                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error-msg">${data.error}</div>`;
                    return;
                }

                if (!data.rows || data.rows.length === 0) {
                    container.innerHTML = '<p class="empty">Query ran, no rows returned.</p>';
                    return;
                }

                const columns = data.columns || Object.keys(data.rows[0]);
                const numericCols = new Set();
                for (const col of columns) {
                    const val = data.rows[0][col];
                    if (typeof val === 'number') numericCols.add(col);
                }

                let html = `
                    <div class="result-info">
                        <span><span class="mark mark-ok"></span> ${data.row_count} row${data.row_count > 1 ? 's' : ''} returned</span>
                    </div>
                    <div class="results-wrapper">
                        <table class="register results-table">
                            <thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead>
                            <tbody>
                `;

                for (const row of data.rows) {
                    html += '<tr>';
                    for (const col of columns) {
                        const val = row[col];
                        const cls = numericCols.has(col) ? ' class="numeric"' : '';
                        const display = val === null || val === undefined ? '-' : String(val);
                        html += `<td${cls}>${display}</td>`;
                    }
                    html += '</tr>';
                }

                html += '</tbody></table></div>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="error-msg">Connection error: ${e.message}</div>`;
            }
        }

        async function syncWarehouse() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Syncing...';

            try {
                const res = await fetch(`${API}/api/warehouse/sync`, { method: 'POST' });
                const data = await res.json();
                btn.textContent = `Synced ${data.fact_records} records`;
                setTimeout(() => { btn.textContent = 'Sync from PG'; btn.disabled = false; }, 3000);
                loadStatus();
            } catch (e) {
                btn.textContent = 'Failed';
                setTimeout(() => { btn.textContent = 'Sync from PG'; btn.disabled = false; }, 3000);
            }
        }

        async function resetWarehouse() {
            if (!confirm('ลบข้อมูลทั้งหมดใน DuckDB?\n\nข้อมูลใน PostgreSQL จะไม่ถูกลบ คุณสามารถ Sync from PG ใหม่ได้')) return;

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const res = await fetch(`${API}/api/warehouse/reset`, { method: 'DELETE' });
                const data = await res.json();
                btn.textContent = `Deleted ${data.total_deleted} rows`;
                setTimeout(() => { btn.textContent = 'Reset DuckDB'; btn.disabled = false; }, 3000);
                loadStatus();
            } catch (e) {
                btn.textContent = 'Failed';
                setTimeout(() => { btn.textContent = 'Reset DuckDB'; btn.disabled = false; }, 3000);
            }
        }

        // Init
        loadStatus();
        loadSchema();
        runQuery();
    </script>
</body>
</html>
