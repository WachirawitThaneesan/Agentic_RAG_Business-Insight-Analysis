<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Business Agent</title>
    <meta name="description" content="Thai financial document extraction and analysis with configurable local or cloud OCR and retrieval">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <link rel="manifest" href="/brand/site.webmanifest">
    <meta name="theme-color" content="#16171B">
    <script>
        // Dark is the default; a saved choice wins. Applied before first paint.
        try {
            if (localStorage.getItem('ba-theme') === 'light') document.documentElement.dataset.theme = 'light';
        } catch (_) { /* storage blocked: stay on the default */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="style.css?v=20261011-28">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="#dashboard" class="brand"><svg class="brand-mark" viewBox="30 28 196 196" aria-hidden="true"><path class="logo-b" fill-rule="evenodd" d="M50 34h40v64h52a60 60 0 0 1 0 120H50ZM90 136v42h52a21 21 0 0 0 0-42Z"/><rect class="logo-sup" x="166" y="34" width="40" height="40" rx="8"/></svg><span class="brand-name">Business Agent</span><span class="brand-sub">Hybrid RAG</span></a>

            <nav class="nav" aria-label="Main">
                <a href="#dashboard" class="nav-item active" data-page="dashboard" id="nav-dashboard">Overview</a>
                <a href="#chat" class="nav-item" data-page="chat" id="nav-chat">Ask</a>
                <a href="#documents" class="nav-item" data-page="documents" id="nav-documents">Documents</a>
                <a href="#scraping" class="nav-item" data-page="scraping" id="nav-scraping">Web search</a>
                <a href="#visualizer" class="nav-item" data-page="visualizer" id="nav-visualizer">Chunks</a>
            </nav>

            <div class="topbar-tools">
                <span class="status-indicator" id="system-status" data-state="checking" role="status">
                    <span id="system-status-text">Checking</span>
                </span>
                <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch to light theme">
                    <i class="ph ph-sun" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content" id="main-content" tabindex="-1">
        <!-- Pages are rendered dynamically -->
    </main>

    <script src="components/scraping.js?v=20261011-28"></script>

</html>
